services:
  - type: web
    name: veritas-gem
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/system/status
    envVars:
      - key: VERITAS_LOG_LEVEL
        value: INFO
      - key: VERITAS_DEBUG
        value: "false"
