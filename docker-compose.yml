services:
  veritas-gem:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veritas-gem-app
    ports:
      - "8000:8000"
    environment:
      - VERITAS_HOST=0.0.0.0
      - VERITAS_PORT=8000
      - VERITAS_DEBUG=false
      - VERITAS_LOG_LEVEL=INFO
      - VERITAS_LOG_JSON=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
